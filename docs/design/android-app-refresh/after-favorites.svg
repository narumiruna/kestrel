<svg xmlns="http://www.w3.org/2000/svg" width="360" height="780" viewBox="0 0 360 780">
<rect width="360" height="780" fill="#f4f7fb"/>
<text x="20" y="42" font-family="Inter,Arial,sans-serif" font-size="22" font-weight="700" fill="#17202a">Favorites — after</text>
<text x="20" y="66" font-family="Inter,Arial,sans-serif" font-size="12" fill="#44505d">Screen header, item cards, safer delete</text>
<rect x="16" y="90" width="328" height="96" rx="18" fill="#ffffff" stroke="#c2ceda" stroke-width="1"/>
<text x="32" y="116" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17202a">Favorites</text>
<text x="32" y="136" font-family="Inter,Arial,sans-serif" font-size="11" fill="#44505d">Saved points and routes for quick mock-GPS starts.</text>
<rect x="16" y="200" width="328" height="126" rx="18" fill="#ffffff" stroke="#c2ceda" stroke-width="1"/>
<text x="32" y="226" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17202a">Long Place Name</text>
<text x="32" y="246" font-family="Inter,Arial,sans-serif" font-size="11" fill="#44505d">Description gets room; actions wrap below content.</text>
