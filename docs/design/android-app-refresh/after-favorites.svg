<text x="32" y="366" font-family="Inter,Arial,sans-serif" font-size="15" font-weight="700" fill="#17202a">Delete favorite?</text>
<text x="32" y="386" font-family="Inter,Arial,sans-serif" font-size="11" fill="#44505d">Destructive actions now require confirmation.</text>
<rect x="32" y="408" width="72" height="30" rx="15" fill="#0066b8" stroke="#0066b8"/>
