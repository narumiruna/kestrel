exclude: ^(gradle/wrapper/|gradlew(\.bat)?$|.*\.bat$)

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-yaml
      - id: check-json
      - id: check-toml
      - id: check-merge-conflict
      - id: mixed-line-ending
        args: ['--fix=lf']

  - repo: local
    hooks:
      - id: spotless
        name: spotless apply (ktlint + format)
        entry: just android-format
        language: system
        pass_filenames: false
        files: \.(kt|kts|xml|md|toml|yaml)$|^justfile$
      - id: biome
        name: biome ci (web)
        entry: just web-check
        language: system
        pass_filenames: false
        files: ^web/.*\.(ts|tsx|js|jsx|json|jsonc|css)$
