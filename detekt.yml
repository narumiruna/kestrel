style:
  MagicNumber:
    active: false
  ReturnCount:
    max: 4
  MaxLineLength:
    active: false
  WildcardImport:
    active: false
  UnusedPrivateFunction:
    active: true
  UnusedPrivateProperty:
    active: true

complexity:
  LongMethod:
    allowedLines: 80
  LongParameterList:
    allowedFunctionParameters: 16
    allowedConstructorParameters: 16
  ComplexCondition:
    allowedConditions: 6
  CyclomaticComplexMethod:
    allowedComplexity: 20
  TooManyFunctions:
    allowedFunctionsPerFile: 30
    allowedFunctionsPerClass: 20

naming:
  FunctionNaming:
    ignoreAnnotated: ['Composable', 'Preview', 'PreviewScreenSizes']
  TopLevelPropertyNaming:
    constantPattern: '[A-Z][_A-Z0-9]*'
