name: Bump version

on:
  workflow_dispatch:
    inputs:
      version_name:
        description: New Android versionName (for example 1.1.0 or 1.1.0-beta.1)
        required: true
        type: string
      version_code:
        description: Optional Android versionCode. Leave blank to increment by 1.
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update gradle.properties
        id: bump
        run: |
          python3 scripts/bump-version.py \
            "${{ inputs.version_name }}" \
            "${{ inputs.version_code }}"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}
          base: main
          branch: "automation/bump-version-${{ inputs.version_name }}"
          delete-branch: true
          commit-message: "chore: bump version to ${{ inputs.version_name }}"
          title: "chore: bump version to ${{ inputs.version_name }}"
          body: |
            ## Summary
            - bump `appVersionName` to `${{ inputs.version_name }}`
            - bump `appVersionCode` to `${{ steps.bump.outputs.version_code }}`

            ## Notes
            - generated by `.github/workflows/bump-version.yml`
            - requires repository secret `PAT_TOKEN` so the resulting PR can trigger downstream CI workflows
