name: Bump version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Semantic version segment to increment for Android, backend, and web.
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: read

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - name: Require PAT token
        env:
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: |
          if [ -z "$PAT_TOKEN" ]; then
            echo "Repository secret PAT_TOKEN is required to push version bumps that trigger downstream workflows" >&2
            exit 1
          fi

      - uses: actions/checkout@v7
        with:
          ref: main
          token: ${{ secrets.PAT_TOKEN }}

      - name: Update shared version metadata
        id: bump
        run: |
          python3 scripts/bump-version.py "${{ inputs.bump_type }}"

      - name: Commit and push version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle.properties backend/package.json backend/package-lock.json web/package.json web/package-lock.json
          git commit -m "chore: bump version to ${{ steps.bump.outputs.version_name }}"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
