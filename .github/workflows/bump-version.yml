name: Bump version

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: Semantic version segment to increment for Android, backend, and web.
        required: true
        default: "patch"
        type: choice
        options:
          - major
          - minor
          - patch

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: bump-version
  cancel-in-progress: false

jobs:
  bump-version:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Update shared version metadata
        id: bump
        run: |
          python3 scripts/bump-version.py "${{ inputs.bump_type }}"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.PAT_TOKEN }}
          base: main
          branch: "automation/bump-version-${{ steps.bump.outputs.version_name }}"
          delete-branch: true
          commit-message: "chore: bump version to ${{ steps.bump.outputs.version_name }}"
          title: "chore: bump version to ${{ steps.bump.outputs.version_name }}"
          body: |
            ## Summary
            - bump shared Android/backend/web version to `${{ steps.bump.outputs.version_name }}` via `${{ inputs.bump_type }}`
            - bump Android `appVersionCode` to `${{ steps.bump.outputs.version_code }}`

            ## Notes
            - generated by `.github/workflows/bump-version.yml`
            - requires repository secret `PAT_TOKEN` so the resulting PR can trigger downstream CI workflows
