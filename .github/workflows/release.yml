name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag:
        description: Existing git tag to release (for example v1.1.0)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: "release-${{ inputs.tag || github.ref_name }}"
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: "${{ inputs.tag || github.ref }}"

      - uses: actions/setup-java@v5.7.0
        with:
          distribution: temurin
          java-version: 26

      - uses: gradle/actions/setup-gradle@v6

      - name: Resolve release metadata
        id: meta
        run: |
          scripts/resolve-release-metadata.sh "${{ inputs.tag || github.ref_name }}"

      - name: Decode release keystore
        env:
          ANDROID_RELEASE_KEYSTORE_BASE64: ${{ secrets.ANDROID_RELEASE_KEYSTORE_BASE64 }}
        run: |
          test -n "$ANDROID_RELEASE_KEYSTORE_BASE64"
          printf '%s' "$ANDROID_RELEASE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/kestrel-release.jks"
          chmod 600 "$RUNNER_TEMP/kestrel-release.jks"

      - name: Build signed release APK
        env:
          KESTREL_RELEASE_KEYSTORE_PATH: ${{ runner.temp }}/kestrel-release.jks
          KESTREL_RELEASE_STORE_PASSWORD: ${{ secrets.ANDROID_RELEASE_STORE_PASSWORD }}
          KESTREL_RELEASE_KEY_ALIAS: ${{ secrets.ANDROID_RELEASE_KEY_ALIAS }}
          KESTREL_RELEASE_KEY_PASSWORD: ${{ secrets.ANDROID_RELEASE_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Verify and rename release artifact
        run: |
          apksigner="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$apksigner"
          "$apksigner" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk
          cp \
            app/build/outputs/apk/release/app-release.apk \
            app/build/outputs/apk/release/${{ steps.meta.outputs.apk_name }}

      - uses: actions/upload-artifact@v7
        with:
          name: "app-release-${{ steps.meta.outputs.version_name }}"
          path: "app/build/outputs/apk/release/${{ steps.meta.outputs.apk_name }}"
          if-no-files-found: error

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "${{ steps.meta.outputs.tag }}"
          name: "Kestrel ${{ steps.meta.outputs.tag }}"
          generate_release_notes: true
          prerelease: ${{ contains(steps.meta.outputs.version_name, '-') }}
          files: "app/build/outputs/apk/release/${{ steps.meta.outputs.apk_name }}"
