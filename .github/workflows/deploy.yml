name: Deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          # Previous dev-stack deploys bind-mounted the checkout and may have left
          # root-owned ignored build artifacts (for example web/.next).
          clean: false

      - name: Validate and deploy with Docker Compose
        env:
          POSTGRES_DB: ${{ secrets.POSTGRES_DB }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          AUTH_ACCESS_TOKEN_SECRET: ${{ secrets.AUTH_ACCESS_TOKEN_SECRET }}
          AUTH_OIDC_CLIENT_ID: ${{ vars.AUTH_OIDC_CLIENT_ID }}
          AUTH_OIDC_CLIENT_SECRET: ${{ secrets.AUTH_OIDC_CLIENT_SECRET }}
          AUTH_OIDC_DISPLAY_NAME: ${{ vars.AUTH_OIDC_DISPLAY_NAME }}
          AUTH_OIDC_FLOW_ENCRYPTION_KEY: ${{ secrets.AUTH_OIDC_FLOW_ENCRYPTION_KEY }}
          AUTH_OIDC_ISSUER: ${{ vars.AUTH_OIDC_ISSUER }}
          KESTREL_PUBLIC_URL: ${{ vars.KESTREL_PUBLIC_URL }}
          AUTH_TOTP_ENCRYPTION_KEY: ${{ secrets.AUTH_TOTP_ENCRYPTION_KEY }}
        run: |
          docker compose --env-file /dev/null -f compose.yaml config --quiet
          docker compose --env-file /dev/null -f compose.yaml up -d --build --remove-orphans
