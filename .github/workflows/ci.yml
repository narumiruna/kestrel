name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
      i18n: ${{ steps.filter.outputs.i18n }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        with:
          filters: |
            android:
              - 'app/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'detekt.yml'
              - 'detekt-baseline.xml'
              - 'branding/**'
              - 'scripts/generate-kestrel-icons.mjs'
              - 'scripts/check-i18n*.mjs'
              - 'web/i18n/**'
              - 'web/messages/**'
              - 'justfile'
              - '.github/workflows/**'
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            web:
              - 'web/**'
              - 'docs/remote-control-api.md'
              - 'docs/device-session-security.md'
              - 'docs/android-qr-login-api.md'
              - 'scripts/generate-public-docs*.mjs'
              - 'branding/**'
              - 'scripts/generate-kestrel-icons.mjs'
              - 'scripts/check-i18n*.mjs'
              - 'app/src/main/res/**'
              - 'justfile'
              - '.github/workflows/**'
            i18n:
              - 'app/**'
              - 'web/**'
              - 'scripts/check-i18n*.mjs'
              - 'justfile'
              - '.github/workflows/**'

  android:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@77dd5b2ce225ea11469928ac317850245a74ae78 # v6.2.0
        with:
          distribution: temurin
          java-version: 26

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6

      - uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: '1.59.0'

      - name: Check Android formatting
        run: just android-check

      - name: Lint Android
        run: just android-lint

      - name: Validate Android resources and translations
        run: just android-resource-lint

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: failure()
        with:
          name: android-ui-screenshot-report
          path: app/build/reports/screenshotTest/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  i18n:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.i18n == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install catalog parser dependencies
        run: npm ci --prefix web

      - name: Validate catalogs and validator regression fixtures
        run: |
          node --experimental-strip-types --test scripts/check-i18n.test.mjs
          node --experimental-strip-types scripts/check-i18n.mjs

  backend:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Test (e2e)
        run: npm run test:e2e

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Verify offline AI library integration
        run: npm run test:ai:integration

  web:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check generated brand icons
        run: node ../scripts/generate-kestrel-icons.mjs --check

      - name: Check published documentation
        run: |
          node ../scripts/generate-public-docs.mjs --check
          node --test ../scripts/generate-public-docs.test.mjs

      - name: Test
        run: npm test

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build
