name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      android: ${{ steps.filter.outputs.android }}
      backend: ${{ steps.filter.outputs.backend }}
      web: ${{ steps.filter.outputs.web }}
    steps:
      - uses: actions/checkout@v7
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          filters: |
            android:
              - 'app/**'
              - 'build.gradle.kts'
              - 'settings.gradle.kts'
              - 'gradle.properties'
              - 'gradle/**'
              - 'detekt.yml'
              - 'detekt-baseline.xml'
              - 'justfile'
              - '.github/workflows/**'
            backend:
              - 'backend/**'
              - '.github/workflows/**'
            web:
              - 'web/**'
              - '.github/workflows/**'

  android:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.android == 'true'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 26

      - uses: gradle/actions/setup-gradle@v6

      - uses: extractions/setup-just@v4

      - name: Check Android formatting
        run: just android-check

      - name: Lint Android
        run: just android-lint

      - name: Build debug APK
        run: ./gradlew :app:assembleDebug

      - name: Run Android unit tests
        run: ./gradlew :app:testDebugUnitTest

      - name: Validate Android UI screenshots
        run: ./gradlew :app:validateDebugScreenshotTest

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: android-ui-screenshot-report
          path: app/build/reports/screenshotTest/
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: app-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  backend:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Test (e2e)
        run: npm run test:e2e

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

  web:
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.web == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Start isolated UI test stack
        working-directory: .
        run: |
          timeout 170s env \
            KESTREL_DEV_WEB_PORT=3401 \
            KESTREL_DEV_BACKEND_PORT=3400 \
            KESTREL_DEV_POSTGRES_PORT=15433 \
            docker compose -p kestrel-webtest -f compose.dev.yaml --profile watch up -d --build
          for attempt in {1..45}; do
            if curl --fail --silent http://127.0.0.1:3400/health >/dev/null && \
              curl --fail --silent http://127.0.0.1:3401/login >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          docker compose -p kestrel-webtest -f compose.dev.yaml logs
          exit 1

      - name: Run desktop-light Web UI regression tests
        env:
          KESTREL_UI_BASE_URL: http://127.0.0.1:3401
        run: timeout 170s npm run test:ui -- --project=desktop-light

      - name: Run mobile-light Web UI regression tests
        env:
          KESTREL_UI_BASE_URL: http://127.0.0.1:3401
        run: timeout 170s npm run test:ui -- --project=mobile-light

      - name: Run desktop-dark Web UI regression tests
        env:
          KESTREL_UI_BASE_URL: http://127.0.0.1:3401
        run: timeout 170s npm run test:ui -- --project=desktop-dark

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: web-ui-regression-report
          path: |
            web/playwright-report/
            web/test-results/
          if-no-files-found: ignore

      - name: Stop isolated UI test stack
        if: always()
        working-directory: .
        run: docker compose -p kestrel-webtest -f compose.dev.yaml --profile watch --profile image down
