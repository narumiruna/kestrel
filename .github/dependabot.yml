version: 2
updates:
  - package-ecosystem: "gradle"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"

  - package-ecosystem: "npm"
    directories:
      - "/backend"
      - "/web"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"

  - package-ecosystem: "github-actions"
    directory: "/"
    cooldown:
      default-days: 7
    schedule:
      interval: "weekly"
