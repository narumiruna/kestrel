services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: kestrel_cloud
      POSTGRES_USER: kestrel
      POSTGRES_PASSWORD: kestrel
    ports:
      - "${KESTREL_POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kestrel -d kestrel_cloud"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://kestrel:kestrel@postgres:5432/kestrel_cloud?schema=public
      AUTH_ACCESS_TOKEN_SECRET: replace-me-with-a-long-random-secret
      AUTH_ACCESS_TOKEN_TTL_SECONDS: "900"
      AUTH_RATE_LIMIT_MAX_ATTEMPTS: "5"
      AUTH_RATE_LIMIT_WINDOW_SECONDS: "900"
      AUTH_RATE_LIMIT_BLOCK_SECONDS: "900"
      AUTH_TOTP_ENCRYPTION_KEY: MDEyMzQ1Njc4OWFiY2RlZjAxMjM0NTY3ODlhYmNkZWY=
      AUTH_TOTP_ISSUER: Kestrel Cloud
      PORT: "3000"
    ports:
      - "${KESTREL_BACKEND_PORT:-3000}:3000"
    volumes:
      - ./backend:/app
      - backend-node_modules:/app/node_modules
    command: sh -c "npx prisma generate && npx prisma migrate deploy && npm run start:dev"

  web:
    build:
      context: ./web
    depends_on:
      backend:
        condition: service_started
    environment:
      KESTREL_API_BASE_URL: http://backend:3000
      WATCHPACK_POLLING: "true"
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "${KESTREL_WEB_PORT:-3001}:3001"
    volumes:
      - ./web:/app
      - web-node_modules:/app/node_modules
    command: npx next dev --hostname 0.0.0.0 --port 3001

volumes:
  postgres-data:
  backend-node_modules:
  web-node_modules:
